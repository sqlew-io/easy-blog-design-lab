  <h1>紫黒の黒髪に、静かな艶を宿す</h1>

  <p>黒髪はただ黒いだけではない。紫の気配をわずかに宿したとき、初めて「生きている黒」になる。</p>

  <div class="figure">
    <img src="https://picsum.photos/seed/goth-ed-a/1100/680" alt="">
    <figcaption>内側に沈めた紫が、光を受けてわずかに浮かび上がる。</figcaption>
  </div>

  <h2>内側に沈める</h2>
  <p>多くの紫黒は表面に色を載せる。LILITHでは毛束の内側に極薄の紫をレイヤリングする。動いた瞬間にだけ、紫が顔を掠める。その機微こそが、この店の色だ。</p>

  <div class="divider"></div>

  <p>艶を殺さないために、温度と時間を徹底的に管理する。低温度長時間置きの施術と、仕上げの紫系ミスト。これがLILITHの紫黒の正体。</p>
