<section class="article-head"><p class="kicker">MIRROR NOTE · CARE</p><h1>夜のブラシで、朝の面をつくる</h1></section>
<article class="mirror-article container">
  <div class="article-photo"><img src="https://picsum.photos/seed/miroir-brush/900/1100" alt="鏡台の上のブラシ"></div>
  <div class="article-text"><p class="lead">髪は一本ずつではなく、面で見えます。夜のブラッシングは、その面を静かに揃えるための時間です。</p><h2>左右で違う癖を見る</h2><p>分け目や寝癖は、左右で出方が異なります。鏡の片側だけで判断せず、少し距離を置いて全体を確かめます。</p><h2>摩擦を減らす準備</h2><p>毛先をほどいてから、ブラシを根元へ。枕に触れる前に薄くオイルをなじませると、翌朝の広がりが穏やかになります。</p><figure><img src="https://picsum.photos/seed/miroir-oil/1000/620" alt="ヘアオイルとアンティークミラー"><figcaption>小さな一滴を、両手に広げて面で置く。</figcaption></figure><a class="back-link" href="index.html">Journal へ戻る</a></div>
</article>
