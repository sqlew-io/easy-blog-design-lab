    <h1>白金台に、霧の部屋を開きました</h1>
    <time datetime="2026-08-12">二〇二六 · 八月十二日</time>
    <div class="article__body drop">
      <p>白金台の、通りから一段奥まった場所にアトリエを開きました。看板は小さく、呼び込みもしません。扉を閉めたあとの静けさを、いちばんの道具だと思っています。</p>
      <p>カットの前に、十分ほど何もしない時間があります。鏡の中の肩が落ちてから、鋏を持ちます。話さなくても大丈夫です。必要なことだけ、短く伺います。</p>
      <figure>

      </figure>
      <p>個室は三つ。窓の外は、いつもの白金台です。中は、霧のような光だけが残るようにしています。</p>
