<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATELIER BRUME — ルックブック</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="rail">
    <a class="brand" href="index.html">ATELIER<br>BRUME</a>
    <p class="rail__place">白金台 · 個室</p>
    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="nav-burger" aria-label="メニューを開く"><span></span><span></span><span></span></label>
    <nav class="site-nav">
      <a href="index.html" aria-current="page">ルック</a>
      <a href="page.html">メニュー</a>
      <a href="page.html#access">アクセス</a>
    </nav>
    <p class="rail__blurb">霧のような光のなかで、髪だけを見る小さな部屋。</p>
  </aside>

  <div class="canvas">
    <main>
      <header class="canvas__head">
        <h1>Lookbook</h1>
        <p>部屋の光と、切ったあとの線。</p>
      </header>
      <div class="looks">
        <a class="shot" href="article.html">
          <div class="shot__frame">
            <img src="https://picsum.photos/seed/omp46-brume-look-01/800/1000" alt="朝の個室">
          </div>
          <h2>朝の個室</h2>
          <p>白金台に、霧の部屋を開きました</p>
        </a>
        <a class="shot" href="article.html">
          <div class="shot__frame">
            <img src="https://picsum.photos/seed/omp46-brume-look-02/800/1000" alt="朝のベージュ">
          </div>
          <h2>朝のベージュ</h2>
          <p>今季の色は、彩度を一段下げて</p>
        </a>
        <a class="shot" href="article.html">
          <div class="shot__frame">
            <img src="https://picsum.photos/seed/omp46-brume-look-03/800/1000" alt="鋏を置く机">
          </div>
          <h2>鋏を置く机</h2>
          <p>カットは、刃を持たない時間から</p>
        </a>
        <a class="shot" href="article.html">
          <div class="shot__frame">
            <img src="https://picsum.photos/seed/omp46-brume-look-04/800/1000" alt="白金台の窓">
          </div>
          <h2>白金台の窓</h2>
          <p>個室で過ごす、九十分</p>
        </a>
        <a class="shot" href="article.html">
          <div class="shot__frame">
            <img src="https://picsum.photos/seed/omp46-brume-look-05/800/1000" alt="仕上げの手">
          </div>
          <h2>仕上げの手</h2>
          <p>香りより、翌朝の指通り</p>
        </a>
      </div>
    </main>
    <footer class="site-footer">
      <p>アトリエ ブリュム · 白金台駅 徒歩4分</p>
    </footer>
  </div>
</body>
</html>
